[build]
  # Tiết kiệm Credit: Chỉ kích hoạt build nếu có thay đổi trong thư mục src hoặc public
  # Nếu chỉ sửa README.md, task.md hay .env.example -> Netlify sẽ KHÔNG build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../src/ ../public/"

[build.environment]
  NODE_VERSION = "20"
